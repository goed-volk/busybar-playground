name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm derives the version from the tag

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package version matches tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/busybar_kit-${expected}-py3-none-any.whl" \
            || { echo "::error::Built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
