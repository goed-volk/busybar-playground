[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "busybar-kit"
dynamic = ["version"]
description = "Shared office-context kit and multi-device connection layer for BUSY Bar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jan van Unnik", email = "jvu-busybar@jvu.email" }
]
dependencies = [
  "busylib>=2.6.1,<3",
  "python-dotenv>=1.2.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.0",
  "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Version is derived from git tags (vX.Y.Z). Untagged commits get a .devN suffix.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: touches a real BUSY Bar device",
  "emulator: needs the BUSY Bar emulator on 127.0.0.1:8080",
]
addopts = '-m "not hardware and not emulator"'
